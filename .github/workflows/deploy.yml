name: Generate assets & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      asset_name:
        description: Asset display name (same name replaces the previous asset)
        required: true
        default: Atlas / T-Pose
        type: string
      target_faces:
        description: Exact triangle budget
        required: true
        default: '1500'
        type: choice
        options: ['800', '1500', '3000']
      flat_shading:
        description: Export crisp, flat face normals
        required: true
        default: true
        type: boolean
      persist_assets:
        description: Commit generated models and manifest back to the triggering branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize builds and deployment together to prevent stale manifests/Pages races.
concurrency:
  group: asset-generator-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test geometry and exports
        run: python -m unittest discover -s tests -v
      - name: Generate asset
        env:
          ASSET_NAME: ${{ inputs.asset_name || 'Atlas / T-Pose' }}
          TARGET_FACES: ${{ inputs.target_faces || '1500' }}
          # Do not use `inputs.flat_shading || true`: false is a valid input.
          FLAT_SHADING: ${{ github.event_name == 'push' || inputs.flat_shading }}
        shell: bash
        run: |
          set -euo pipefail
          shading=--no-flat-shade
          if [[ "$FLAT_SHADING" == 'true' ]]; then shading=--flat-shade; fi
          python scripts/generate_asset.py --name "$ASSET_NAME" --target-faces "$TARGET_FACES" "$shading" --preset stylized-tpose
      - name: Configure repository links
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('public/config.json').write_text(json.dumps({'repository': os.environ['REPOSITORY']}, indent=2) + '\n')
          PY
      - name: Persist generated models (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.persist_assets
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/models public/assets/manifest.json public/config.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist generated 3D assets [skip ci]'
            git push origin "HEAD:$BRANCH"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
